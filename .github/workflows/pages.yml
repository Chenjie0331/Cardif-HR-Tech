name: Deploy Cardif-HR Tech to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Verify platform tests
        working-directory: Cardif-HR-Tech_GitHub原始碼
        run: node --test tests/*.test.cjs
      - name: Prepare website with root index.html
        env:
          SOURCE: Cardif-HR-Tech_GitHub原始碼
        run: |
          mkdir _site
          cp "$SOURCE/index.html" _site/
          cp -R "$SOURCE/css" "$SOURCE/js" "$SOURCE/assets" _site/
          test -s _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
